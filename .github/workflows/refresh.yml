name: Refresh site from the sheet

# Netlify has no built-in cron for builds, so this just pings the site's build hook.
# Netlify then re-reads the Google Sheet and redeploys (new films only cost API calls thanks to the cache).
on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          test -n "$HOOK" || { echo "NETLIFY_BUILD_HOOK secret is not set"; exit 1; }
          curl -fsS -X POST -d '{}' "$HOOK"
